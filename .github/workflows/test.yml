name: Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    container:
      image: python:3.14.7-slim-trixie
    steps:
      - uses: actions/checkout@v4

      - name: Install Hatch
        run: pip install hatch

      - name: Run tests
        run: hatch run test:run --cov=jrpc_core --cov=tests --cov-report=xml

      - name: Upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.xml
