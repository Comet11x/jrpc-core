[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "jrpc-core"
dynamic = ["version"]
description = ''
readme = "README.md"
requires-python = ">=3.8"
license = "MIT"
keywords = []
authors = [
  { name = "comet11x", email = "comet11x@protonmail.com" },
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Programming Language :: Python",
  "Programming Language :: Python :: 3.8",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: Implementation :: CPython",
  "Programming Language :: Python :: Implementation :: PyPy",
]
dependencies = []

[project.urls]
Documentation = "https://github.com/comet11x/jrpc-core#readme"
Issues = "https://github.com/comet11x/jrpc-core/issues"
Source = "https://github.com/comet11x/jrpc-core"

[tool.hatch.version]
path = "src/jrpc_core/__about__.py"

[tool.hatch.envs.types]
extra-dependencies = [
  "mypy>=1.0.0",
]
[tool.hatch.envs.types.scripts]
check = "mypy --install-types --non-interactive {args:src/jrpc_core tests}"

[tool.coverage.run]
source_pkgs = ["jrpc_core", "tests"]
branch = true
parallel = true
omit = [
  "src/jrpc_core/__about__.py",
]

[tool.coverage.paths]
jrpc_core = ["src/jrpc_core", "*/jrpc-core/src/jrpc_core"]
tests = ["tests", "*/jrpc-core/tests"]

[tool.coverage.report]
exclude_lines = [
  "no cov",
  "if __name__ == .__main__.:",
  "if TYPE_CHECKING:",
]
