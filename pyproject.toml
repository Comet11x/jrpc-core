[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "jrpc-core"
dynamic = ["version"]
description = ''
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
keywords = ["json-rpc", "jsonrpc", "rpc"]
authors = [
  { name = "comet11x", email = "comet11x@protonmail.com" },
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Programming Language :: Python",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: Python :: Implementation :: CPython",
  "Programming Language :: Python :: Implementation :: PyPy",
]
dependencies = [
    "pydantic>=2.13.4",
    "pyfplib>=0.2.3",
]

[project.urls]
Documentation = "https://github.com/comet11x/jrpc-core#readme"
Issues = "https://github.com/comet11x/jrpc-core/issues"
Source = "https://github.com/comet11x/jrpc-core"

[project.optional-dependencies]
test = [
  "pytest>=8.0.0",
  "pytest-cov>=6.0.0",
]

[tool.hatch.version]
path = "src/jrpc_core/__about__.py"

[tool.hatch.envs.test]
extra-dependencies = [
  "pytest>=8.0.0",
  "pytest-cov>=6.0.0",
]
[tool.hatch.envs.test.scripts]
run = "pytest {args:tests}"

[tool.hatch.envs.types]
extra-dependencies = [
  "mypy>=1.0.0",
]
[tool.hatch.envs.types.scripts]
check = "mypy --install-types --non-interactive {args:src/jrpc_core tests}"

[tool.coverage.run]
source_pkgs = ["jrpc_core", "tests"]
branch = true
parallel = true
omit = [
  "src/jrpc_core/__about__.py",
]

[tool.coverage.paths]
jrpc_core = ["src/jrpc_core", "*/jrpc-core/src/jrpc_core"]
tests = ["tests", "*/jrpc-core/tests"]

[tool.coverage.report]
exclude_lines = [
  "no cov",
  "if __name__ == .__main__.:",
  "if TYPE_CHECKING:",
]
