name: Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    container:
      image: python:3.14.7-slim-trixie
    steps:
      - uses: actions/checkout@v4

      - name: Install curl
        run: |
          sudo apt-get update
          sudo apt-get install -y curl

      - name: Install Hatch
        run: pip install hatch

      - name: Run tests
        run: hatch run test:run --cov=jrpc_core --cov=tests --cov-report=xml

      - name: Upload coverage to Coveralls
        uses: coverallsapp/github-action@v2
        with:
          file: coverage.xml
          format: cobertura
        env:
          COVERALLS_TOKEN: ${{ secrets.COVERALLS_REPO_TOKEN }}
